<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-aapanel</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .clock {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #e2e2e2 70%, #cfcfcf 100%);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25),
        inset 0 0 0 10px #ffffff,
        inset 0 0 0 12px #b0b0b0;
    }

    /* hour ticks */
    .tick {
      position: absolute;
      width: 4px;
      height: 16px;
      background: #444;
      left: 50%;
      top: 8px;
      transform-origin: 2px 152px;
      border-radius: 2px;
    }

    .tick.major {
      height: 22px;
      width: 5px;
      background: #222;
    }

    /* center hub */
    .hub {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #333;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
      z-index: 3;
    }

    /* clock hands, arranged to visually echo "1 . 0 . 0" */
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      background: #222;
      border-radius: 4px;
      z-index: 2;
    }

    .hand.hour {
      width: 6px;
      height: 70px;
      margin-left: -3px;
      transform: rotate(30deg);
      /* points to "1" */
      background: #1a1a1a;
    }

    .hand.minute {
      width: 4px;
      height: 100px;
      margin-left: -2px;
      transform: rotate(0deg);
      /* points to "12/0" */
      background: #333;
    }

    .hand.second {
      width: 2px;
      height: 110px;
      margin-left: -1px;
      transform: rotate(0deg);
      /* points to "12/0" */
      background: #c0392b;
    }

    /* digital version readout, styled like a watch complication window */
    .version-window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 60px);
      background: #1c1c1c;
      color: #f5f5f5;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 3px;
      box-shadow: inset 0 0 0 1px #444, 0 2px 4px rgba(0, 0, 0, 0.4);
      z-index: 3;
      font-variant-numeric: tabular-nums;
    }

    .frame {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #d8d8d8, #ffffff);
      z-index: -1;
    }
  </style>
</head>

<body>
  <div class="clock" id="clock">
    <div class="frame"></div>
    <div class="version-window">1.0.1</div>
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="hub"></div>
  </div>

  <script>
    const clock = document.getElementById('clock');
    const ticksCount = 60;
    for (let i = 0; i < ticksCount; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
      tick.style.transform = `rotate(${i * 6}deg)`;
      clock.appendChild(tick);
    }
  </script>
</body>

</html>
