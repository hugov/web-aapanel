<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web aApanel v1.0.2</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .square {
      width: 480px;
      height: 260px;
      background: #000000;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .version {
      color: #ffffff;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <div class="square">
    <div class="version">1.0.2</div>
  </div>
</body>

</html>
